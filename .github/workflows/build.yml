name: Build Zygisk Module
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
    - name: Build 64-bit
      run: |
        mkdir -p build64 && cd build64
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        mv zygisk_cfhide.so arm64-v8a.so
        cd ..
    - name: Build 32-bit
      run: |
        mkdir -p build32 && cd build32
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        mv zygisk_cfhide.so armeabi-v7a.so
        cd ..
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: zygisk-cfhide
        path: |
          build64/arm64-v8a.so
          build32/armeabi-v7a.so
